<!DOCTYPE html>
<html>
<head>
    <title>Even or Odd (0 to 15)</title>
</head>
<body>

<h2>Check Even or Odd from 0 to 15</h2>

<button onclick="checkNumbers()">Show Result</button>

<div id="output"></div>

<script>

function checkNumbers() {
    let result = "";

    for (let i = 0; i <= 15; i++) {
        if (i % 2 === 0) {
            result += i + " is Even <br>";
        } else {
            result += i + " is Odd <br>";
        }
    }

    document.getElementById("output").innerHTML = result;
}

</script>

</body>
</html>
