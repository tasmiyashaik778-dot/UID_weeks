<!DOCTYPE html>
<html>
<head>
    <title>Sign of Product</title>
</head>
<body>

<h2>Find Sign of Product</h2>

<label>Enter first number:</label>
<input type="number" id="num1"><br><br>

<label>Enter second number:</label>
<input type="number" id="num2"><br><br>

<label>Enter third number:</label>
<input type="number" id="num3"><br><br>

<button onclick="findSign()">Check Sign</button>

<script>

function findSign() {
    let a = parseInt(document.getElementById("num1").value);
    let b = parseInt(document.getElementById("num2").value);
    let c = parseInt(document.getElementById("num3").value);

    let product = a * b * c;

    if (product > 0) {
        alert("The sign is Positive (+)");
    }
    else if (product < 0) {
        alert("The sign is Negative (-)");
    }
    else {
        alert("The product is Zero");
    }
}

</script>

</body>
</html>
