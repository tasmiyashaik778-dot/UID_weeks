<!DOCTYPE html>
<html>
<head>
    <title>Sort Three Numbers</title>
</head>
<body>

<h2>Sort Three Numbers</h2>

<label>Enter first number:</label>
<input type="number" id="num1"><br><br>

<label>Enter second number:</label>
<input type="number" id="num2"><br><br>

<label>Enter third number:</label>
<input type="number" id="num3"><br><br>

<button onclick="sortNumbers()">Sort Numbers</button>

<script>

function sortNumbers() {
    let a = parseInt(document.getElementById("num1").value);
    let b = parseInt(document.getElementById("num2").value);
    let c = parseInt(document.getElementById("num3").value);

    let result;

    if (a <= b && a <= c) {
        if (b <= c)
            result = a + ", " + b + ", " + c;
        else
            result = a + ", " + c + ", " + b;
    }
    else if (b <= a && b <= c) {
        if (a <= c)
            result = b + ", " + a + ", " + c;
        else
            result = b + ", " + c + ", " + a;
    }
    else {
        if (a <= b)
            result = c + ", " + a + ", " + b;
        else
            result = c + ", " + b + ", " + a;
    }

    alert("Sorted numbers (Ascending): " + result);
}

</script>

</body>
</html>
