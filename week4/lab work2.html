<!DOCTYPE html>
<html>
<body style="background-color:peachpuff; color: black;text-align: left">
 <h1 style="font-family: Verdana, Geneva, Tahoma, sans-serif;font: size 100%; text-align: center;">TWO FORMS DISPLAYED USING IFRAMES</h1>
</body>
<table align="center" cellpadding="20">
    <tr>
        <!-- First Table -->
        <td border: 2px solid black;>
            <table border="1" cellpadding="10">
                <tr>
                    <th colspan="2">User Login</th>
                </tr>
                <tr>
                    <td>Username:</td>
                    <td><input type="text"></td>
                </tr>
                <tr>
                    <td>Password:</td>
                    <td><input type="password"></td>
                </tr>
                <tr>
                    <td colspan="2" align="center">
                        <input type="button" value="Login">
                    </td>
                </tr>
            </table>
        </td>

        <!-- Second Table -->
        <td border: 2px solid black;>
            <table border="1" cellpadding="10">
                <tr>
                    <th colspan="2">User Registration</th>
                </tr>
                <tr>
                    <td>Full Name:</td>
                    <td><input type="text"></td>
                </tr>
                <tr>
                    <td>Email:</td>
                    <td><input type="text"></td>
                </tr>
                <tr>
                    <td>Phone:</td>
                    <td><input type="text"></td>
                </tr>
                <tr>
                    <td>Password:</td>
                    <td><input type="password"></td>
                </tr>
                <tr>
                    <td colspan="2" align="center">
                        <input type="button" value="Register">
                        <input type="reset" value="Reset">
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
