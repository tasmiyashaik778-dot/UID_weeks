<!DOCTYPE html> 
<html> 
<head> 
<style> 
.ball { 
width: 50px; 
height: 50px; 
background-color: pink; 
border-radius: 50%; 
animation-name: moveUpDown; 
animation-duration: 1s; 
animation-iteration-count: infinite; 
animation-direction: alternate; }
@keyframes moveUpDown { 
from { 
margin-top: 0px; 
} 
to { 
margin-top: 200px; } 
} 
</style> 
</head> 
<body> 
<div class="ball"></div>
</body>
